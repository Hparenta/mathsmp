<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Guru - HParentaEdu CBT</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="login-container">
    <section class="login-card">
      <h1>HParentaEdu CBT</h1>
      <p class="subtitle">Portal Guru</p>

      <form id="teacherLoginForm">
        <label for="email">Email Guru</label>
        <input
          id="email"
          type="email"
          placeholder="Masukkan email guru"
          autocomplete="username"
          required
        >

        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          placeholder="Masukkan password"
          autocomplete="current-password"
          required
        >

        <button type="submit" id="loginButton">
          Masuk sebagai Guru
        </button>

        <p id="message" role="alert" aria-live="polite"></p>
      </form>

      <p class="footer">
        HParentaEdu · Portal Guru
      </p>
    </section>
  </main>

  <script type="module" src="js/teacher-auth.js"></script>
</body>
</html>
