<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Tabel waktu dan suhu air</title><desc id="svg-desc">Tabel nilai waktu 0, 2, 4, 6, 8 menit dan suhu 25, 37, 49, 61, 73 derajat Celsius.</desc>
<defs>
 <style>
  text{font-family:Arial,Helvetica,sans-serif;fill:#263b59}
  .title{font-size:23px;font-weight:700;fill:#173b70}
  .label{font-size:18px;font-weight:700;fill:#173b70}
  .small{font-size:15px;fill:#64748b}
  .tiny{font-size:13px;fill:#64748b}
  .axis{stroke:#263b59;stroke-width:2.5;fill:none}
  .grid{stroke:#dce6f3;stroke-width:1}
  .blue{stroke:#2563eb;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .teal{stroke:#0f8b83;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .dash{stroke-dasharray:8 7}
 </style>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#2563eb" stroke-width="1.4"/></marker>
 <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#64748b" stroke-width="1.4"/></marker>
</defs>
<rect x="0" y="0" width="920" height="500" rx="24" fill="#ffffff"/>
<text x="42" y="46" class="title">Hubungan waktu dan suhu air</text><text x="42" y="78" class="small">Kenaikan suhu tercatat secara teratur</text>
<g transform="translate(55 135)"><rect width="810" height="230" rx="16" fill="#fff" stroke="#cbd8e8" stroke-width="2"/><path d="M0 115 H810 M150 0 V230 M282 0 V230 M414 0 V230 M546 0 V230 M678 0 V230" stroke="#cbd8e8" stroke-width="2" fill="none"/><rect width="150" height="115" rx="15" fill="#edf4ff"/><rect y="115" width="150" height="115" fill="#f7fbff"/>
<text x="75" y="60" text-anchor="middle" class="label">Waktu</text><text x="75" y="86" text-anchor="middle" class="tiny">(menit)</text><text x="75" y="175" text-anchor="middle" class="label">Suhu</text><text x="75" y="201" text-anchor="middle" class="tiny">(°C)</text>
<g text-anchor="middle" class="label"><text x="216" y="70">0</text><text x="348" y="70">2</text><text x="480" y="70">4</text><text x="612" y="70">6</text><text x="744" y="70">8</text><text x="216" y="180">25</text><text x="348" y="180">37</text><text x="480" y="180">49</text><text x="612" y="180">61</text><text x="744" y="180">73</text></g></g>
<rect x="620" y="395" width="245" height="48" rx="14" fill="#e6f7f3"/><text x="742" y="425" text-anchor="middle" font-size="16" font-weight="700" fill="#0f766e">Bertambah 12°C tiap 2 menit</text>
</svg>