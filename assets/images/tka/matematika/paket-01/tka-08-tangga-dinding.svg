<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Ilustrasi tangga bersandar pada dinding</title><desc id="svg-desc">Dua posisi tangga sepanjang 6,5 meter: posisi awal dengan tinggi 6 meter dan jarak kaki 2,5 meter, posisi akhir setelah ujung atas turun 0,8 meter.</desc>
<defs>
 <style>
  text{font-family:Arial,Helvetica,sans-serif;fill:#263b59}
  .title{font-size:23px;font-weight:700;fill:#173b70}
  .label{font-size:18px;font-weight:700;fill:#173b70}
  .small{font-size:15px;fill:#64748b}
  .tiny{font-size:13px;fill:#64748b}
  .axis{stroke:#263b59;stroke-width:2.5;fill:none}
  .grid{stroke:#dce6f3;stroke-width:1}
  .blue{stroke:#2563eb;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .teal{stroke:#0f8b83;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .dash{stroke-dasharray:8 7}
 </style>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#2563eb" stroke-width="1.4"/></marker>
 <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#64748b" stroke-width="1.4"/></marker>
</defs>
<rect x="0" y="0" width="920" height="500" rx="24" fill="#ffffff"/>
<text x="42" y="44" class="title">Perubahan posisi tangga</text><text x="42" y="73" class="small">Panjang tangga tetap 6,5 m</text>
<path d="M150 110 V415 H820" stroke="#536b89" stroke-width="9" fill="none" stroke-linecap="round"/>
<path d="M150 380 h22 v-22" stroke="#536b89" stroke-width="2.5" fill="none"/>
<!-- posisi awal --> <path d="M150 150 L250 390" stroke="#7b92b4" stroke-width="8" stroke-dasharray="12 9" fill="none" stroke-linecap="round"/>
<!-- posisi akhir --> <path d="M150 182 L306 390" stroke="#2563eb" stroke-width="8" fill="none" stroke-linecap="round"/>
<circle cx="150" cy="150" r="7" fill="#7b92b4"/><circle cx="150" cy="182" r="7" fill="#2563eb"/>
<circle cx="250" cy="390" r="7" fill="#7b92b4"/><circle cx="306" cy="390" r="7" fill="#2563eb"/>
<path d="M188 150 V182" stroke="#0f8b83" stroke-width="3" marker-end="url(#arrow)"/><text x="202" y="174" class="label" fill="#0f766e">0,8 m</text>
<path d="M250 425 H306" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/><text x="278" y="455" text-anchor="middle" class="label">? m</text>
<text x="175" y="276" class="small" transform="rotate(67 175 276)">6,5 m</text>
<path d="M112 150 V390" stroke="#7b92b4" stroke-width="2"/><text x="93" y="270" text-anchor="middle" class="small" transform="rotate(-90 93 270)">6 m</text>
<path d="M130 390 H250" stroke="#7b92b4" stroke-width="2"/><text x="190" y="414" text-anchor="middle" class="small">2,5 m</text>
<text x="340" y="188" class="label" fill="#2563eb">Posisi akhir</text><text x="340" y="214" class="small">Titik atas turun 0,8 m</text><text x="340" y="244" class="small">Kaki bergeser menjauhi dinding</text>
<g transform="translate(615 105)"><rect width="235" height="104" rx="16" fill="#f1f6ff" stroke="#d8e5f8"/><text x="20" y="34" class="tiny">Posisi awal</text><text x="20" y="65" class="label">Tinggi 6 m</text><text x="20" y="88" class="small">Jarak kaki 2,5 m</text></g>
<g transform="translate(615 230)"><rect width="235" height="104" rx="16" fill="#eaf8f5" stroke="#ccebe3"/><text x="20" y="34" class="tiny">Posisi akhir</text><text x="20" y="65" class="label">Tinggi 5,2 m</text><text x="20" y="88" class="small">Jarak kaki 3,9 m</text></g>
</svg>