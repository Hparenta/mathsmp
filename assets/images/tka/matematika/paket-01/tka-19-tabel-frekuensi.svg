<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Tabel frekuensi nilai kuis</title><desc id="svg-desc">Tabel nilai 5, 6, 7, 8, 9, dan 10 dengan frekuensi berturut-turut 1, 2, 3, 2, 1, dan 1.</desc>
<defs>
 <style>
