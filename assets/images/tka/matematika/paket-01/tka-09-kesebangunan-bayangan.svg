<path d="M150 265 V385" stroke="#64748b" stroke-width="2"/><path d="M140 265 H160 M140 385 H160" stroke="#64748b" stroke-width="2"/><text x="125" y="325" class="label" text-anchor="middle">2 m</text>
<text x="228" y="414" class="label" text-anchor="middle">1,6 m</text><text x="180" y="220" class="label" text-anchor="middle">Tiang</text>
