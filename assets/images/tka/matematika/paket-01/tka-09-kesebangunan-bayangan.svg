<path d="M535 60 V385" stroke="#64748b" stroke-width="2"/><path d="M525 60 H545 M525 385 H545" stroke="#64748b" stroke-width="2"/><text x="500" y="230" class="label" text-anchor="middle">? m</text>
<text x="700" y="414" class="label" text-anchor="middle">10,4 m</text><text x="620" y="90" class="label" text-anchor="start">Pohon</text>
