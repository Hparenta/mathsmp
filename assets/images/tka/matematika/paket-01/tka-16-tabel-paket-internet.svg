<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Tabel perbandingan biaya dua paket internet</title><desc id="svg-desc">Paket 1 memiliki biaya tetap Rp50.000 dan biaya Rp2.000 per GB; Paket 2 Rp20.000 dan Rp5.000 per GB.</desc>
<defs>
 <style>
  text{font-family:Arial,Helvetica,sans-serif;fill:#263b59}
  .title{font-size:23px;font-weight:700;fill:#173b70}
  .label{font-size:18px;font-weight:700;fill:#173b70}
  .small{font-size:15px;fill:#64748b}
  .tiny{font-size:13px;fill:#64748b}
  .axis{stroke:#263b59;stroke-width:2.5;fill:none}
  .grid{stroke:#dce6f3;stroke-width:1}
  .blue{stroke:#2563eb;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .teal{stroke:#0f8b83;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .dash{stroke-dasharray:8 7}
 </style>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#2563eb" stroke-width="1.4"/></marker>
 <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#64748b" stroke-width="1.4"/></marker>
</defs>
<rect x="0" y="0" width="920" height="500" rx="24" fill="#ffffff"/>
<text x="42" y="48" class="title">Perbandingan paket internet</text><text x="42" y="80" class="small">Komponen biaya bulanan berdasarkan pemakaian data</text>
<g transform="translate(55 135)"><rect width="810" height="245" rx="17" fill="#fff" stroke="#cbd8e8" stroke-width="2"/><path d="M0 82 H810 M0 163 H810 M245 0 V245 M525 0 V245" stroke="#cbd8e8" stroke-width="2" fill="none"/><path d="M0 17 Q0 0 17 0 H793 Q810 0 810 17 V82 H0Z" fill="#edf4ff"/>
<g class="label" text-anchor="middle"><text x="122" y="52">Paket</text><text x="385" y="52">Biaya tetap</text><text x="667" y="52">Biaya per GB</text></g>
<g text-anchor="middle" font-size="20" font-weight="700"><text x="122" y="134">Paket 1</text><text x="385" y="134">Rp50.000</text><text x="667" y="134">Rp2.000</text><text x="122" y="215">Paket 2</text><text x="385" y="215">Rp20.000</text><text x="667" y="215">Rp5.000</text></g></g>
<text x="55" y="430" class="tiny">Biaya total = biaya tetap + (biaya per GB × pemakaian data)</text>
</svg>