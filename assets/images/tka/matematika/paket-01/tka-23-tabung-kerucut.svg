<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Ilustrasi tabung dan kerucut</title><desc id="svg-desc">Tabung dan kerucut berdampingan dengan jari-jari alas 7 sentimeter dan tinggi 12 sentimeter.</desc>
<defs>
 <style>
  text{font-family:Arial,Helvetica,sans-serif;fill:#263b59}
  .title{font-size:23px;font-weight:700;fill:#173b70}
  .label{font-size:18px;font-weight:700;fill:#173b70}
  .small{font-size:15px;fill:#64748b}
  .tiny{font-size:13px;fill:#64748b}
  .axis{stroke:#263b59;stroke-width:2.5;fill:none}
  .grid{stroke:#dce6f3;stroke-width:1}
  .blue{stroke:#2563eb;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .teal{stroke:#0f8b83;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .dash{stroke-dasharray:8 7}
 </style>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#2563eb" stroke-width="1.4"/></marker>
 <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#64748b" stroke-width="1.4"/></marker>
</defs>
<rect x="0" y="0" width="920" height="500" rx="24" fill="#ffffff"/>
<text x="42" y="42" class="title">Tabung dan kerucut dengan ukuran sama</text><text x="42" y="72" class="small">Jari-jari alas 7 cm dan tinggi 12 cm</text>
<!-- cylinder --> <g><ellipse cx="265" cy="155" rx="105" ry="30" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><path d="M160 155 V375 M370 155 V375" stroke="#2563eb" stroke-width="4"/><path d="M160 375 A105 30 0 0 0 370 375" stroke="#2563eb" stroke-width="4" fill="#bfdbfe"/><path d="M160 375 A105 30 0 0 1 370 375" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 6" fill="none"/><path d="M265 155 V375" stroke="#93a7c3" stroke-dasharray="6 6"/><path d="M265 155 L370 155" stroke="#0f8b83" stroke-width="3"/><text x="315" y="143" class="label" fill="#0f766e">r = 7 cm</text><path d="M390 155 V375 M382 155 H398 M382 375 H398" stroke="#64748b" stroke-width="2"/><text x="415" y="270" class="label" transform="rotate(90 415 270)">12 cm</text><text x="265" y="430" text-anchor="middle" class="label">Tabung</text></g>
