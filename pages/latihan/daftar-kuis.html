<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#173b68">
  <title>Kuis — MathSMP</title>
  <link rel="stylesheet" href="../../assets/css/style-baru.css">
  <link rel="stylesheet" href="../../assets/css/latihan-hub.css">
</head>
<body class="lh-page">
<header class="lh-header">
  <div class="lh-container lh-header-inner">
    <a class="lh-brand" href="../../index.html" aria-label="MathSMP, Beranda">
      <span class="lh-brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><path d="M5 11.5c6.7-2.4 13.2-1.2 19 3.1v26c-5.8-4.3-12.3-5.5-19-3.1v-26Z" fill="currentColor" opacity=".96"/><path d="M43 11.5c-6.7-2.4-13.2-1.2-19 3.1v26c5.8-4.3 12.3-5.5 19-3.1v-26Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M8 16c4.5-1 8.5-.4 12 1.6M8 22c4.5-1 8.5-.4 12 1.6M28 17.6c3.5-2 7.5-2.6 12-1.6M28 23.6c3.5-2 7.5-2.6 12-1.6" stroke="#173b68" stroke-width="1.5" stroke-linecap="round"/></svg></span>
      <span>Math<strong>SMP</strong></span>
    </a>
    <a class="lh-home-link" href="../../index.html"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1V10Z" fill="currentColor" opacity=".9"/></svg> Beranda</a>
  </div>
</header>
<main class="lh-main">
  <div class="lh-container">
    <div class="lh-breadcrumb"><a href="latihan-soal.html">Latihan Soal</a><span>›</span><a id="breadcrumbMapel" href="pilih-jenis.html?mapel=matematika">Matematika</a><span>›</span><span>Kuis</span></div>
    <section class="lh-intro" aria-labelledby="judulKuis">
      <div class="lh-intro-icon" style="background:linear-gradient(145deg,#9276e5,#6747b7);box-shadow:0 12px 28px rgba(119,82,201,.2)" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><rect x="8" y="8" width="32" height="36" rx="5" stroke="currentColor" stroke-width="3"/><rect x="17" y="4" width="14" height="9" rx="3" fill="currentColor"/><path d="m15 23 3 3 5-6m4 4h7m-19 9 3 3 5-6m4 4h7" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div><span class="lh-eyebrow" style="color:#7752c9">Evaluasi dan latihan</span><h1 id="judulKuis">Kuis Matematika</h1><p>Pilih paket kuis yang disediakan guru, lalu kerjakan sesuai petunjuk di setiap paket.</p></div>
    </section>
    <div id="daftarPaket" class="lh-quiz-grid" aria-live="polite"></div>
    <a class="lh-back-link" id="kembaliJenis" href="pilih-jenis.html?mapel=matematika"><svg viewBox="0 0 24 24" fill="none"><path d="m14 5-7 7 7 7M7 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Kembali ke pilihan Bank Soal / Kuis</a>
  </div>
  <div class="lh-wave" aria-hidden="true"></div>
</main>
<footer class="lh-footer">© 2026 MathSMP · Kuis disiapkan untuk latihan dan evaluasi</footer>
<script>
(() => {
  const mapelLabels = { matematika: 'Matematika', 'bahasa-indonesia': 'Bahasa Indonesia' };
  const params = new URLSearchParams(location.search);
  const mapel = params.get('mapel') || 'matematika';
  if (!mapelLabels[mapel]) { location.replace('latihan-soal.html'); return; }
  const label = mapelLabels[mapel];
  document.title = `Kuis ${label} — MathSMP`;
  document.getElementById('judulKuis').textContent = `Kuis ${label}`;
  document.getElementById('breadcrumbMapel').textContent = label;
  document.getElementById('breadcrumbMapel').href = `pilih-jenis.html?mapel=${encodeURIComponent(mapel)}`;
  document.getElementById('kembaliJenis').href = `pilih-jenis.html?mapel=${encodeURIComponent(mapel)}`;
  const container = document.getElementById('daftarPaket');
  const icon = '<svg viewBox="0 0 24 24" fill="none"><path d="M7 4h10a2 2 0 0 1 2 2v15l-7-4-7 4V6a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 8h6M9 11h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
  const packages = mapel === 'matematika' ? [
    { id: 'populasiSampel', title: 'Populasi dan Sampel', grade: 'Kelas IX', info: 'Bank soal tersedia · 10 soal acak per sesi' },
    { id: 'operasiBilanganRasional', title: 'Operasi Bilangan Rasional', grade: 'Kelas VII', info: 'Bank soal tersedia · 10 soal acak per sesi' },
    { id: 'fungsiLinear', title: 'Fungsi Linear dan Grafiknya', grade: 'Kelas VIII', info: 'Bank soal tersedia · 10 soal acak per sesi' },
    { id: 'bangunRuangSisiLengkung', title: 'Bangun Ruang Sisi Lengkung', grade: 'Kelas IX', info: 'Bank soal tersedia · 10 soal acak per sesi' }
  ] : mapel === 'bahasa-indonesia' ? [
    { id: 'bahasaIndonesiaKelas7SemesterGanjil', title: 'UAS Bahasa Indonesia — Semester Ganjil', grade: 'Kelas VII', info: '30 soal pilihan ganda · 10 LOTS · 15 Medium · 5 HOTS' }
  ] : [];
  if (!packages.length) {
    container.innerHTML = `<section class="lh-panel lh-empty" style="grid-column:1/-1"><span class="lh-empty-icon" aria-hidden="true">📝</span><h2>Paket Kuis ${label} belum didaftarkan</h2><p>Tempat paket kuis ${label} sudah tersedia. Setelah naskah dan bank soal regulernya dimasukkan ke repositori, paket akan ditampilkan di halaman ini. Bank dan Tryout TKA tetap terpisah.</p></section>`;
    return;
  }
  container.innerHTML = packages.map(item => `
    <article class="lh-quiz-card">
      <span class="lh-quiz-icon" aria-hidden="true">${icon}</span>
      <div class="lh-quiz-copy"><h2>${item.title}</h2><p>${item.grade} · ${item.info}</p></div>
      <a class="lh-quiz-action" href="kuis.html?topik=${encodeURIComponent(item.id)}&mapel=${encodeURIComponent(mapel)}">Mulai Kuis <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14m-6-6 6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    </article>`).join('');
})();
</script>
</body>
</html>
